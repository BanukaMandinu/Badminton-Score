<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Badminton Score</title>
  <meta name="description" content="Shared team roster, live schedule, and score tracker for daily badminton sessions." />
  <meta name="theme-color" content="#F3F5F9" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏸</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">🏸</span>
        <span class="brand-name">Badminton Score</span>
      </div>
      <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
        <svg id="theme-icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        <svg id="theme-icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </header>

    <main class="views">
      <section class="view" id="view-schedule" data-view="schedule">
        <div id="schedule-content"></div>
      </section>

      <section class="view" id="view-leaderboard" data-view="leaderboard" hidden>
        <h1>Leaderboard</h1>
        <div id="leaderboard-content" class="stack"></div>
      </section>

      <section class="view" id="view-teams" data-view="teams" hidden>
        <div class="view-header">
          <h1>Teams</h1>
        </div>
        <div class="row" style="margin-bottom:16px">
          <button class="btn btn-primary" id="teams-add-btn">+ Add team</button>
          <button class="btn btn-secondary" id="teams-randomize-btn">Randomize teams</button>
        </div>
        <div id="teams-list" class="stack"></div>
      </section>

      <section class="view" id="view-history" data-view="history" hidden>
        <h1>History</h1>
        <div id="history-content" class="stack"></div>
      </section>

      <section class="view" id="view-settings" data-view="settings" hidden>
        <h1>Settings</h1>
        <div class="card stack" style="gap:14px">
          <div>
            <div class="field-label">Theme</div>
            <div class="segmented" id="theme-segmented">
              <button data-theme="system" class="segment">System</button>
              <button data-theme="light" class="segment">Light</button>
              <button data-theme="dark" class="segment">Dark</button>
            </div>
          </div>
          <div>
            <div class="field-label">Accent color</div>
            <div class="swatches" id="accent-swatches"></div>
          </div>
          <div>
            <div class="field-label">New session defaults</div>
            <div class="row">
              <label class="field">
                <span>Courts</span>
                <input type="number" min="1" id="default-courts" />
              </label>
              <label class="field">
                <span>Rounds</span>
                <input type="number" min="1" id="default-rounds" />
              </label>
            </div>
            <div class="field-label" style="margin-top:10px">Match duration</div>
            <div class="segmented" id="default-timing-segmented">
              <button data-timing="finish" class="segment">Play until finish</button>
              <button data-timing="timed" class="segment">Timed</button>
            </div>
            <label class="field" id="default-minutes-field" style="margin-top:10px">
              <span>Minutes / match</span>
              <input type="number" min="5" id="default-minutes" />
            </label>
            <div class="field-label" style="margin-top:10px">Default scoring rule</div>
            <div class="segmented" id="default-rule-segmented">
              <button data-rule="bwf21" class="segment">BWF 21</button>
              <button data-rule="classic15" class="segment">Classic 15</button>
            </div>
            <div class="field-label" style="margin-top:10px">Final match</div>
            <div class="segmented" id="default-final-segmented">
              <button data-final="yes" class="segment">With final</button>
              <button data-final="no" class="segment">Without final</button>
            </div>
          </div>
          <p class="muted small">Data (teams, schedule, scores, history) is shared with everyone who opens this link — it lives in a small hosted database, not just this device.</p>
        </div>
      </section>
    </main>

    <nav class="tabbar">
      <button class="tab active" data-tab="schedule">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span>Schedule</span>
      </button>
      <button class="tab" data-tab="leaderboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4a1 1 0 0 0-1 1 5 5 0 0 0 4.5 5M17 6h3a1 1 0 0 1 1 1 5 5 0 0 1-4.5 5"/></svg>
        <span>Leaders</span>
      </button>
      <button class="tab" data-tab="teams">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Teams</span>
      </button>
      <button class="tab" data-tab="history">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
        <span>History</span>
      </button>
      <button class="tab" data-tab="settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.14.43.5.77 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <div class="overlay" id="modal-root" hidden></div>
  <div class="dialog-overlay" id="dialog-root" hidden></div>
  <div class="toast-root" id="toast-root" aria-live="polite"></div>

  <script src="/app.js" defer></script>
</body>
</html>
