name = "badminton-score"
main = "src/index.ts"
compatibility_date = "2025-09-27"

# Run the Worker near the D1 database: each request makes several
# sequential queries, so the Worker-to-DB distance dominates latency.
[placement]
mode = "smart"

[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "badminton"
database_id = "c4860c60-03c2-4421-90dc-d95bbede40fa"
